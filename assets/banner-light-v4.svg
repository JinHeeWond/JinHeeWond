<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jin Hee Won">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f5f7"/>
    </linearGradient>
    <linearGradient id="arc" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d4601c"/><stop offset=".55" stop-color="#b08800"/><stop offset="1" stop-color="#b08800" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4601c"/><stop offset="1" stop-color="#b08800"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d0d7de" stop-opacity="0"/><stop offset=".5" stop-color="#d0d7de"/><stop offset="1" stop-color="#d0d7de" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="14"/></clipPath>
    <style>
      .name { font: 600 44px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; letter-spacing: -0.6px; }
      .sub  { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #656d76; }
      .meta { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #656d76; letter-spacing: 2px; }
      .tag  { font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d4601c; letter-spacing: 1.5px; }
      .idx  { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #656d76; letter-spacing: 3px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <!-- concentric arcs from the bottom-right corner -->
    <g fill="none" stroke="url(#arc)" stroke-width="1" opacity=".22">
      <circle cx="1200" cy="300" r="110"/>
      <circle cx="1200" cy="300" r="170"/>
      <circle cx="1200" cy="300" r="230"/>
      <circle cx="1200" cy="300" r="290"/>
      <circle cx="1200" cy="300" r="350"/>
      <circle cx="1200" cy="300" r="410"/>
    </g>
    <!-- diagonal hairline -->
    <line x1="760" y1="300" x2="1060" y2="0" stroke="url(#rule)" stroke-width="1" opacity=".35"/>
    <!-- top hairline -->
    <rect x="0" y="0" width="1200" height="1" fill="url(#hair)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="none" stroke="#d0d7de"/>

  <!-- corner index marks -->
  <text class="idx" x="64" y="52">01</text>
  <text class="idx" x="1104" y="52" text-anchor="end">PORTFOLIO</text>

  <g transform="translate(64 0)">
    <text class="name" x="0" y="140">Jin Hee Won</text>
    <rect x="2" y="156" width="40" height="2" fill="url(#rule)"/>
    <text class="sub" x="2" y="192">Building things with Web and AI</text>
    <text class="meta" x="2" y="246">HANDONG GLOBAL UNIVERSITY  ·  COMPUTER ENGINEERING</text>
    <text class="tag" x="2" y="268">frontend  /  llm agents  /  product</text>
  </g>
</svg>
