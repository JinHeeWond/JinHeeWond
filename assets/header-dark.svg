<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jin Hee Won">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#30363d"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="300" rx="16"/></clipPath>
    <style>
      .name { font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -0.5px; }
      .kor  { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #8b949e; letter-spacing: 6px; }
      .sub  { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .meta { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: 1px; }
      .tag  { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f0883e; letter-spacing: 1px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#161b22"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect x="0" y="0" width="8" height="300" fill="url(#bar)"/>

    <!-- rabbit motif -->
    <g transform="translate(1010 168) scale(0.9)">
      <!-- sparkles -->
      <path d="M-120 -70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#e3b341"/>
      <path d="M118 -40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#f0883e"/>
      <path d="M-128 30 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#e3b341"/>
      <!-- ears -->
      <g transform="rotate(-10 -28 -40)"><rect x="-44" y="-150" width="32" height="112" rx="16" fill="#f3ede4"/><rect x="-36" y="-138" width="16" height="84" rx="8" fill="#f6b4c3"/></g>
      <g transform="rotate(10 28 -40)"><rect x="12" y="-150" width="32" height="112" rx="16" fill="#f3ede4"/><rect x="20" y="-138" width="16" height="84" rx="8" fill="#f6b4c3"/></g>
      <!-- body -->
      <ellipse cx="0" cy="92" rx="66" ry="50" fill="#e6ddd0"/>
      <ellipse cx="0" cy="98" rx="30" ry="30" fill="#f3ede4"/>
      <!-- paws -->
      <ellipse cx="-30" cy="128" rx="18" ry="10" fill="#f3ede4"/>
      <ellipse cx="30" cy="128" rx="18" ry="10" fill="#f3ede4"/>
      <!-- head -->
      <ellipse cx="0" cy="0" rx="64" ry="56" fill="#f3ede4"/>
      <!-- cheeks -->
      <circle cx="-38" cy="16" r="9" fill="#f6b4c3" opacity=".7"/>
      <circle cx="38" cy="16" r="9" fill="#f6b4c3" opacity=".7"/>
      <!-- eyes -->
      <circle cx="-22" cy="-4" r="5.5" fill="#1f2328"/>
      <circle cx="22" cy="-4" r="5.5" fill="#1f2328"/>
      <circle cx="-20" cy="-6" r="1.8" fill="#ffffff"/>
      <circle cx="24" cy="-6" r="1.8" fill="#ffffff"/>
      <!-- nose + mouth -->
      <path d="M-5 12 L5 12 L0 18 Z" fill="#f6b4c3"/>
      <path d="M0 18 v5 M0 23 q-5 6 -10 1 M0 23 q5 6 10 1" fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round"/>
      <!-- whiskers -->
      <path d="M-50 8 h-26 M-50 16 h-24 M50 8 h26 M50 16 h24" stroke="#c9bfae" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#30363d"/>

  <g transform="translate(64, 0)">
    <text class="name" x="0" y="118">Jin Hee Won</text>
    <text class="sub" x="2" y="160">Building things with Web and AI</text>
    <text class="meta" x="2" y="208">HANDONG GLOBAL UNIVERSITY · COMPUTER ENGINEERING</text>
    <text class="tag" x="2" y="232">// frontend · llm agents · product</text>
  </g>
</svg>
